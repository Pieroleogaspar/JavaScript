<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Exemplo de Animações com jQuery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }
        #box {
            width: 150px;
            height: 150px;
            background-color: steelblue;
            margin: 20px auto;
            border-radius: 10px;
            display: none;        /* começa escondido */
        }

        button {
            margin: 5px;
            padding: 10px 15px;
            border: none;
            background: #444;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #666;
        }
    </style>
</head>

<body>
    <h1>Animações Básicas com jQuery</h1>

    <button id="btnMostrar">Mostrar</button>
    <button id="btnEsconder">Esconder</button>
    <button id="btnAlternar">Alternar</button>
    <button id="btnFade">Fade</button>
    <button id="btnSlide">Slide</button>
    <button id="btnAnimar">Animar</button>

    <div id="box"></div>

    <div class="container mt-4">
        <input type="text" id="nome" placeholder="Digite o nome">
        <button id="btnIncluir">Incluir</button>
        <ul class="list-group" id="lista"></ul>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/animacoes.js"></script>
</body>

</html>
