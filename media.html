<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilitários em Javascript</title>
    <link href="css/style.css" rel="stylesheet">

    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
    <main>
        <section>
            <h2>Média de três números</h2>
            <div id="resultadoMedia"></div>
            <div>
                <label for="primeiro">Primeiro número:</label>
                <input type="number" id="primeiro" step="0.01">
            </div>
            <div>
                <label for="segundo">Segundo número:</label>
                <input type="number" id="segundo" step="0.01">
            </div>
            <div>
                <label for="terceiro">Terceiro número:</label>
                <input type="number" id="terceiro" step="0.01">
            </div>
            <div>
                <label>&nbsp;</label>
                <button id="calcularMedia" class="botao">Calcular Média</button>
            </div>
        </section>


    </main>

    <script src="js/media.js"></script>
</body>
</html>
