<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
      <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
      <title>Lista de deputados federais</title>

      <style>
            .fotinha{
                  height: 30px;
            }
      </style>
</head>
<body class="bg-info bg-opacity-10">

      <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container">
                  <a class="navbar-brand" href="#"><i class="bi bi-ui-checks-grid"></i> DEPUTADOS<strong>FEDERAIS</strong></a>
                  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                  <span class="navbar-toggler-icon"></span>
                  </button>
                  <div class="collapse navbar-collapse" id="navbarNav">
                  <ul class="navbar-nav ms-auto">
                        <li class="nav-item pt-2">Versão JS</li>
                  </ul>
                  </div>
            </div>
      </nav>

      <div class="container mt-4">
            <div class="row d-flex justify-content-center">
                  <div class="col-md-10">
                        <div class="row d-flex justify-content-center bg-white shadow-sm py-3">
                        <div class="col-md-4">
                              
                              <div class="form-floating">
                              <select id="uf" name="uf" class="form-select bg-info bg-opacity-10">
                                    <option value="">Todos</option>
                                    <option>AC</option>
                                    <option>AL</option>
                                    <option>AM</option>
                                    <option>AP</option>
                                    <option>BA</option>
                                    <option>CE</option>
                                    <option>DF</option>
                                    <option>ES</option>
                                    <option>GO</option>
                                    <option>MA</option>
                                    <option>MG</option>
                                    <option>MS</option>
                                    <option>MT</option>
                                    <option>PA</option>
                                    <option>PB</option>
                                    <option>PE</option>
                                    <option>PI</option>
                                    <option>PR</option>
                                    <option>RJ</option>
                                    <option>RN</option>
                                    <option>RO</option>
                                    <option>RR</option>
                                    <option>RS</option>
                                    <option>SC</option>
                                    <option>SE</option>
                                    <option>SP</option>
                                    <option>TO</option>                              
                              </select>
                              <label for="uf">Selecione a UF:</label>
                              </div>
                        </div>
                        <div class="col-md-4">
                              <div class="form-floating">
                              <select id="partido" name="partido" class="form-select bg-info bg-opacity-10">
                                    <option value="">Todos</option>
                                    <option>AVANTE</option>
                                    <option>CIDADANIA</option>
                                    <option>MDB</option>
                                    <option>NOVO</option>
                                    <option>PCdoB</option>
                                    <option>PDT</option>
                                    <option>PL</option>
                                    <option>PODE</option>
                                    <option>PP</option>
                                    <option>PRD</option>
                                    <option>PSB</option>
                                    <option>PSD</option>
                                    <option>PSDB</option>
                                    <option>PSOL</option>
                                    <option>PT</option>
                                    <option>PV</option>
                                    <option>REDE</option>
                                    <option>REPUBLICANOS</option>
                                    <option>SOLIDARIEDADE</option>
                                    <option>UNIÃO</option>
                              </select>
                              <label for="uf">Selecione o partido:</label>
                              </div>
                        </div>
                        <div class="col-md-4">
                              <div class="form-floating">
                              <select id="sexo" name="sexo" class="form-select bg-info bg-opacity-10">
                                    <option value="">Todos</option>
                                    <option value="m">Masculino</option>
                                    <option value="f">Feminino</option>
                              </select>
                              <label for="uf">Selecione o Sexo:</label>
                              </div>
                        </div>
                        </div>
                  </div>
            </div>
      </div>
      <div class="text-center" id="animacao">
            <div class="spinner-border" role="status">
                  <span class="visually-hidden">Loading...</span>
            </div>
      </div>      

      <div class="container mt-2">           
            <div class="row d-flex justify-content-center">
                  <div class="col-md-10 bg-white px-4 py-3 shadow-sm">
                        <div class="table-responsive">
                              <table class="table" id="tabelaDeputados">
                                    <thead>
                                    <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Nome</th>
                                    <th scope="col">Partido</th>
                                    <th scope="col">UF</th>
                                    <th scope="col">&nbsp;</th>
                                    </tr>
                                    </thead>
                                    <tbody id="lista">

                                    </tbody>
                              </table>     
                        </div>
                        <!-- Modal -->
                        <div class="modal fade" id="dadosDeputado" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                              <div class="modal-dialog">
                              <div class="modal-content">
                              <div class="modal-header bg-success">
                                    <h5 class="modal-title nomePrincipal text-white" id="exampleModalLabel"></h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                              </div>
                              <div class="modal-body bg-success-subtle">

                                    <!-- dados do deputado -->
                                    <div class="card mb-3"">
                                          <div class="row g-0">
                                          <div class="col-md-4">
                                          <img id="fotoPrincipal" src="" class="img-fluid rounded-start" alt="...">
                                          </div>
                                          <div class="col-md-8">
                                          <div class="card-body">
                                                <h5 class="card-title fs-2 nomePrincipal"></h5>
                                                <p class="fs-3">
                                                      <span class="card-text partidoPrincipal btn btn-info"></span>
                                                      <span class="card-text ufPrincipal btn btn-info"></span><br>
                                                </p>
                                          </div>
                                          </div>
                                          </div>
                                    </div>
                                    <p class="card-text infosComplementares"></p>

                              </div>
                              </div>
                              </div>
                        </div> 
                        <!-- fim modal -->

                  </div>
            </div>
      </div>      
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2" crossorigin="anonymous"></script>
      <script src="js/deputados-jquery.js"></script> 
</body>
</html>
